schema_version: 2
worksheet_title: Cataloguing Work Sheet
source_form: eHive Cataloguing Guidelines - July 2023, Appendix 1, pp.10-11
target_system: eHive (Vernon Systems)
derived_from: worksheet.yaml (schema_version 1)
capture_groups:
- id: number
  title: Which object is this?
  order: 1
  voice_prompt: Read out the record number written on the object's tag, or from the register.
  restricted: false
- id: identify
  title: What is it?
  order: 2
  voice_prompt: Hold the object and tell me what it is. What would you call it, and what type of thing is it?
  restricted: false
- id: describe
  title: Describe it
  order: 3
  voice_prompt: Describe what you're looking at — shape, colour, parts, decoration. What is it made of? Is there
    any writing, printing, stamps or labels on it? Read those out exactly.
  restricted: false
- id: measure
  title: How big is it?
  order: 4
  voice_prompt: Measure the object and read out the height, width and length. Say the units. If it's heavy enough
    to matter, give me the weight too.
  restricted: false
- id: condition
  title: What condition is it in?
  order: 5
  voice_prompt: What condition is it in? Any damage, wear, repairs, missing parts, rust or staining? Is it complete,
    or are there pieces missing?
  restricted: false
- id: origin
  title: Who made it, and when?
  order: 6
  voice_prompt: Do you know who made it, where it was made, and roughly when? An approximate date is fine — say
    'about 1890' or 'nineteen twenties' if that's all you know.
  restricted: false
- id: story
  title: What's its story?
  order: 7
  voice_prompt: What do you know about its history — who owned it, how it was used, why it matters? And why does
    it belong in this collection?
  restricted: false
- id: collection_management
  title: Where does it live?
  order: 8
  voice_prompt: Where is the object stored or displayed? Does it need any special handling, light, temperature or
    support? Has it been in any exhibitions?
  restricted: false
- id: acquisition
  title: How did we get it?
  order: 9
  voice_prompt: null
  restricted: true
- id: signoff
  title: Sign off
  order: 10
  voice_prompt: null
  restricted: true
sections:
- id: object_details
  title: Object Details
  page: 1
  order: 1
  source: inferred
  description: Core identification, physical description and manufacture information for the object.
  notes: The paper form prints NO section headings. This grouping was inferred during extraction and is a useful
    convenience, not form content.
- id: additional_information
  title: Additional Information
  page: 2
  order: 2
  source: inferred
  description: Contextual, collection-management and interpretive information about the object.
  notes: The paper form prints NO section headings. This grouping was inferred during extraction and is a useful
    convenience, not form content.
- id: acquisition_donor_information
  title: Acquisition & Donor Information
  page: 2
  order: 3
  source: inferred
  description: Details of how the object was acquired and from whom.
  notes: The paper form prints NO section headings. This grouping was inferred during extraction and is a useful
    convenience, not form content.
- id: sign_off
  title: Sign-off
  page: 2
  order: 4
  source: inferred
  description: Completion and cataloguing sign-off, including workflow checklist.
  notes: The paper form prints NO section headings. This grouping was inferred during extraction and is a useful
    convenience, not form content.
- id: media
  title: Photographs & Recording
  page: 0
  order: 0
  source: app_added
  description: Images and audio captured by the app.
  notes: null
- id: record_provenance
  title: Record Provenance
  page: 0
  order: 99
  source: app_added
  description: Who captured this record, when, and how far through review it is.
  notes: null
